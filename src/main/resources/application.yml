server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: fun-student
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

app:
  jwt:
    secret: ${STUDENT_JWT_SECRET:}
  bootstrap:
    email: ${STUDENT_BOOTSTRAP_EMAIL:}
    password: ${STUDENT_BOOTSTRAP_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: "!demo"
  datasource:
    url: ${STUDENT_DB_URL:jdbc:postgresql://localhost:5432/students_db}
    username: ${STUDENT_DB_USER:postgres}
    password: ${STUDENT_DB_PASSWORD:}
    hikari:
      schema: students_schema
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS students_schema
      connection-timeout: 10000

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:fun_student_demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
